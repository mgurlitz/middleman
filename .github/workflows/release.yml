name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    # Upstream publishes through its external pipeline; forks publish here.
    if: github.repository != 'kenn-io/forge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          version: "1.0.0"
          node-version-file: package.json
          cache: false
          run-install: true

      - name: Build and embed both frontends
        run: make frontend githubapp-frontend

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-web-assets
          path: |
            internal/web/dist/
            internal/githubapp/ui/dist/
          if-no-files-found: error

  build:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15
            goos: darwin
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
          - runner: windows-latest
            goos: windows
            goarch: amd64
          - runner: windows-11-arm
            goos: windows
            goarch: arm64

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-web-assets
          path: internal

      - name: Build and package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.goos == 'darwin' && '11.0' || '' }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT="$(git rev-parse HEAD)"
          BUILD_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi

          test -s internal/web/dist/index.html
          test -s internal/githubapp/ui/dist/index.html
          OUTPUT_DIR="${RUNNER_TEMP}/release-${GOOS}-${GOARCH}"
          mkdir -p "$OUTPUT_DIR"
          LDFLAGS="-s -w -X main.version=v${VERSION} -X main.commit=${COMMIT} -X main.buildDate=${BUILD_DATE}"
          go build -buildvcs=false -ldflags="$LDFLAGS" -trimpath \
            -o "$OUTPUT_DIR/kenn-forge${EXT}" ./cmd/kenn-forge

          if [ "$GOOS" = "$(go env GOHOSTOS)" ] && [ "$GOARCH" = "$(go env GOHOSTARCH)" ]; then
            "$OUTPUT_DIR/kenn-forge${EXT}" version
          fi

          cp LICENSE NOTICE "$OUTPUT_DIR/"
          cd "$OUTPUT_DIR"
          ARCHIVE="forge_${VERSION}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            7z a "${ARCHIVE}.zip" "kenn-forge${EXT}" LICENSE NOTICE
          else
            tar czf "${ARCHIVE}.tar.gz" kenn-forge LICENSE NOTICE
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kenn-forge-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ runner.temp }}/release-${{ matrix.goos }}-${{ matrix.goarch }}/*.tar.gz
            ${{ runner.temp }}/release-${{ matrix.goos }}-${{ matrix.goarch }}/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kenn-forge-*
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS

      - name: Get tag message
        id: tag_message
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$(git cat-file -t "$TAG_NAME")" != "tag" ]; then
            echo "has_body=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG_MSG="$(git tag -l --format='%(contents:body)' "$TAG_NAME")"
          if [ -n "$TAG_MSG" ]; then
            DELIM="$(openssl rand -hex 16)"
            {
              echo "body<<$DELIM"
              printf '%s\n' "$TAG_MSG"
              echo "$DELIM"
              echo "has_body=true"
            } >> "$GITHUB_OUTPUT"
          else
            echo "has_body=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS
          fail_on_unmatched_files: true
          body: ${{ steps.tag_message.outputs.has_body == 'true' && steps.tag_message.outputs.body || '' }}
          generate_release_notes: ${{ steps.tag_message.outputs.has_body != 'true' }}
